version: 2
updates:
  # Root workspace manifest
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
        update-types:
          - minor
          - patch
      formatting:
        patterns:
          - "eslint"
          - "prettier"
          - "lint-staged"
          - "husky"
      tooling:
        patterns:
          - "typescript"
          - "turbo"
          - "vitest"
          - "@types/*"

  # Workspace packages (per pnpm-workspace.yaml: apps/*, packages/*, tools/*)
  - package-ecosystem: npm
    directory: /packages/shared
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Jakarta"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /packages/bot-engine
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Jakarta"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Jakarta"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Jakarta"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch